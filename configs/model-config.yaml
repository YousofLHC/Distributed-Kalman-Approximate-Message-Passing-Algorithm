---
landa1                     : [0.9, 0.7, 0.35, 0.1, 0.01, 0.001] 
#landa2                    : "@float @jinja {{1-this.landa1}}" # ! landa2 = 1 - landa1
n_samples                  : 500
n_contour                  : 70
noise                      : 0.05
train_size                 : 0.75
test_size                  : "@float @jinja {{1-this.train_size}}"
random_state               : 2023
solver                     : cvxopt #, daqp, osqp, ecos, mosek, clarabel, scs]
target                     : +1
cv                         : 10
C                          : [0.1, 1, 10, 100, 1000]
onlyTarget                 : False #if setted to False we use all data otherwise we only use target data to obtain matrix `P`

gamma                      : [1.2, 1, 0.5, 0.1, 0.001, 2, 0.75]
degree                     : [1, 3, 5, 4]
kernels__all               : ['rbf', 'sigmoid', 'laplacian'] #, 'linear'] #'laplacian', 'sigmoid', 'additive_chi2', 'chi2', 'cosine']

kernels__poly          : poly
kernels__rbf           : rbf
kernels__linear        : linear
kernels__laplacian     : laplacian
kernels__sigmoid       : sigmoid
kernels__additive_chi2 : additive_chi2
kernels__chi2          : chi2
kernels__cosine        : cosine

...
