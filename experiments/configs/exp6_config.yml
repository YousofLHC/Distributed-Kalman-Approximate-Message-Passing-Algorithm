experiment:
  name: "Experiment 6: One-Class Anomaly Detection using DKF-AMP"
  description: "Compare DKF-AMP with baseline methods on ODDS and KEEL datasets"

datasets:
  odds:
    - Wine
    - Lympho
    - Glass
    - Vertebral
    - Wbc
    - Ecoli
    - Ionosphere
    - Arrhythmia
    - Breastw
    - Pima
    - Vowels
    - "Letter recognition"
    - Cardio
  keel:
    - abalone9-18
    - iris0
    - led7digit-0-2-4-5-6-7-8-9-vs-1
    - winequality-white-9-vs-4
    - yeast-1-vs-7

methods:
  proposed:
    name: "DKF-AMP"
    hyperparameters:
      fold: 10
      lambda: [0.9, 0.7, 0.35, 0.1, 0.01, 0.001]
      C: [0.1, 1, 10, 100, 1000]
      gamma: [1.2, 1, 0.5, 0.1, 0.001, 20.75]
      kernels: ["rbf", "sigmoid", "poly", "laplacian"]
  # Baselines deactivated for now, prioritizing DKF-AMP

output:
  results_dir: "experiments/results/exp6_anomaly_dkf_amp/"
  format: ["csv", "excel"]  # No pickle